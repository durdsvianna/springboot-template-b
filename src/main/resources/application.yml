server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: customer-data-sync
  datasource:
    url: jdbc:h2:mem:addressdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: customer:com.example.customerdatasync.model.Customer

app:
  customer-service:
    url: http://localhost:8081/api/v1/customer
    connect-timeout: 5000
    read-timeout: 5000
  scheduler:
    customer-sync-cron: "0 0 0 * * ?" # Run at midnight every day
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs 